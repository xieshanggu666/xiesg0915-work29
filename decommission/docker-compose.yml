services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decommission
      POSTGRES_PASSWORD: decommission
      POSTGRES_DB: decommission
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decommission"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: decommission
    entrypoint: >
      sh -c "psql -h postgres -U decommission -d decommission -f /sql/0001_init.sql -f /sql/0002_approvals.sql && echo MIGRATION_OK"
    volumes:
      - ./migrations:/sql:ro
    restart: "no"

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://decommission:decommission@postgres:5432/decommission?sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: erasure-reports
      WORKERS: "4"
      CHECKPOINT_EVERY_BYTES: "67108864"
      STALE_AFTER_SEC: "120"
      DEVICE_PATH_PREFIX: "/dev/,/var/lib/erasure/disks/"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
